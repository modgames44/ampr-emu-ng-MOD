[package]
name = "ampr-sys"
version = "0.5.7"
edition = "2021"
license = "GPL-3.0-or-later"

[lib]
crate-type = ["staticlib"]

[dependencies]
ampr-command = { path = "../ampr-command" }
ampr-codec = { path = "../ampr-codec" }
ampr-format = { path = "../ampr-format" }
ampr-hook = { path = "../ampr-hook" }
ampr-lz4 = { path = "../ampr-lz4", default-features = false }
# Pkg mode: checks, arithmetic and the KRAKEN chunk decoder (ampr-pkg).
ampr-pkg = { path = "../ampr-pkg" }

[features]
default = ["lz4_checked"]
# ampr-lz4's bounds guard over lz4_flex's unsafe decode (the default).
lz4_checked = ["ampr-lz4/checked-decode"]
# Fastest LZ4 decode: drops the guard (Makefile AMPR_LZ4_FAST=1, which builds
# with --no-default-features --features lz4_fast). Only for trusted storage; a
# corrupt chunk then reads/writes out of bounds instead of failing cleanly.
# No effect on pkg (Kraken) or zstd games, only LZ4-packed folder games.
lz4_fast = ["ampr-lz4/fast-decode"]
# Debug: periodic internal-pool usage notifications.
mem_report = []
